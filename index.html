<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fff8ef">
  <title>拿下修伯大结果</title>
  <style>
    :root{font-family:ui-rounded,"SF Pro Rounded","Microsoft YaHei",system-ui,sans-serif;color:#4a3d42;background:#fff8ef;font-synthesis:none}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 0,#ffe4df 0,transparent 47%),#fff8ef;display:grid;place-items:center;padding:18px}
    .shell{width:min(100%,460px);text-align:center}.top{display:flex;align-items:center;justify-content:space-between;margin:6px 4px 2px}.brand{text-align:left}.eyebrow{font-size:11px;letter-spacing:.16em;color:#d38084;font-weight:800}.brand h1{font-size:23px;margin:2px 0 0;letter-spacing:.02em}.scorebox{background:#fff;border:1px solid #f7ddd7;padding:8px 13px;border-radius:17px;box-shadow:0 4px 14px #bb756116}.scorebox small{display:block;color:#ad8c8a;font-size:10px}.scorebox b{font-size:20px;color:#df7778}
    .row{display:flex;align-items:center;justify-content:flex-end;min-height:22px;margin:0 5px 6px;font-size:12px;color:#977a78}.row .aimhint{max-width:100%;text-align:right}.best{font-size:10px;color:#ad8c8a;margin-top:2px}.best b{color:#c18a57}
    .board{position:relative;width:100%;aspect-ratio: .78;overflow:hidden;border:5px solid #fff;border-radius:28px;background:linear-gradient(180deg,#fff2ef,#fff9ef 65%,#ffe8da);box-shadow:0 14px 38px #b66e4d1c;touch-action:none;user-select:none}
    .board:before{content:"";position:absolute;inset:0;background-image:radial-gradient(#edb1a833 1px,transparent 1px);background-size:20px 20px;opacity:.65;pointer-events:none}
    .guide{position:absolute;top:0;bottom:0;border-left:1px dashed #df969766;z-index:1;pointer-events:none}.line{position:absolute;top:20%;left:0;right:0;border-top:2px dashed #ef777755;z-index:2;pointer-events:none}.line span{position:absolute;right:7px;top:-17px;font-size:10px;color:#d88786;background:#fff8efb8;padding:1px 5px;border-radius:6px}
    .fruit{position:absolute;z-index:3;aspect-ratio:1/1;flex:none;overflow:hidden;border-radius:50%;display:grid;place-items:center;transform:translate(-50%,-50%);cursor:grab;filter:drop-shadow(0 5px 3px #77525024);transition:filter .1s}.fruit:active{cursor:grabbing;filter:drop-shadow(0 8px 4px #77525030)}.fruit img{display:block;width:100%;height:100%;min-width:100%;min-height:100%;max-width:none;aspect-ratio:1/1;box-sizing:border-box;border-radius:50%;object-fit:cover;border:3px solid #fff9;pointer-events:none}.fruit[data-l="0"] img{filter:saturate(.8)}
    .drop{position:absolute;z-index:4;top:4px;width:0;height:0;opacity:0;pointer-events:none;transform:translateX(-50%);transition:opacity .12s}.drop.on{opacity:1}.drop img{display:block;border:3px solid #fff;border-radius:50%;object-fit:cover;box-shadow:0 4px 12px #8e55503b;transform:translateX(-50%);max-width:calc(100vw - 70px)}.wall{position:absolute;bottom:0;height:7px;background:#f4baa7;width:100%;border-radius:6px 6px 20px 20px;z-index:2}
    .controls{display:flex;justify-content:center;gap:8px;margin-top:13px}.btn{border:0;border-radius:15px;padding:12px 14px;font:inherit;font-weight:750;cursor:pointer;transition:transform .12s,filter .12s}.btn:active{transform:scale(.97)}.primary{flex:1;background:#e78782;color:white;box-shadow:0 5px 12px #db898345}.soft{background:#fff;color:#967672;border:1px solid #f3ded8}.tip{font-size:11px;color:#ae918b;margin:11px 4px 0}.tip b{color:#d77879}.controls .iconbtn{width:44px;padding:10px 0;font-size:17px}.toolbar{display:flex;justify-content:center;gap:7px;margin-top:9px}.toolbar button{border:1px solid #f2ded7;background:#fffaf7;color:#a9847f;border-radius:999px;padding:6px 11px;font:inherit;font-size:11px;cursor:pointer}.fruit.pop{animation:pop .22s ease-out}@keyframes pop{0%{scale:.62}100%{scale:1}}
    .shade{position:absolute;inset:0;background:#503f4a45;display:none;place-items:center;z-index:10}.shade.show{display:grid}.modal{background:#fffaf6;width:82%;padding:24px 18px 18px;border-radius:24px;box-shadow:0 14px 50px #53363a38}.modal h2{margin:0 0 4px;color:#dc777b}.modal p{margin:4px 0 17px;color:#957c79;font-size:13px}.modal #winfruit[hidden]{display:none}.modal #winfruit:not([hidden]){display:block;width:90px;height:90px;margin:4px auto 10px;object-fit:cover;object-position:50% 40%;aspect-ratio:1;border:4px solid white;border-radius:50%;box-shadow:0 5px 16px #8e55503b}.modal p.win-message{margin-top:10px;font-size:11px;line-height:1.55;color:#a58781}.modal-actions{display:flex;gap:8px}.modal-actions .btn{flex:1}.modal-actions [hidden]{display:none}
    .upload{display:none}.foot{font-size:10px;color:#b69b96;margin-top:12px}
    @media(max-height:720px){body{padding:9px}.shell{width:min(100%,390px)}.brand h1{font-size:20px}.controls .btn{padding:9px}.tip{margin-top:7px}}
  </style>
</head>
<body>
  <main class="shell">
    <header class="top"><div class="brand"><div class="eyebrow">XIUBO'S LOVE FRUIT</div><h1>拿下修伯大结果</h1><div class="best">最高甜度 <b id="best">0</b></div></div><div class="scorebox"><small>甜蜜分数</small><b id="score">0</b></div></header>
    <div class="row"><span class="aimhint" id="aimhint">移动落点，看看下一颗果果落在哪里</span></div>
    <section class="board" id="board" aria-label="合成西瓜游戏区域"><div class="line"><span>小心别堆过这里</span></div><div class="wall"></div><div class="drop" id="drop"><img id="next" alt="下一颗搭档果预览"></div><div class="shade" id="shade"><div class="modal"><h2 id="endtitle">再来一局？</h2><img id="winfruit" alt="第十果" hidden><p id="endtext">果果堆到线以上啦</p><div class="modal-actions"><button class="btn primary" id="continue" hidden>继续游戏</button><button class="btn soft" id="again">重新开始</button></div></div></div><div class="shade" id="pauseshade"><div class="modal"><h2>歇一会儿</h2><p>暂停中，准备好就继续吧。</p><button class="btn primary" id="resume">继续游戏</button></div></div><div class="shade" id="helpshade"><div class="modal"><h2>心动合成指南</h2><p>点按空白处设置落点，再点“放下果果”，也可以直接点游戏区域。相同果果相撞会自动合并；果堆碰到上方虚线就结束。拖动最上方刚落下的果果可以微调位置。键盘可用 ← → 移动落点、空格投放、P 暂停、R 重开。</p><button class="btn primary" id="closehelp">知道啦</button></div></div></section>
    <div class="controls"><button class="btn soft iconbtn" id="pause" aria-label="暂停" title="暂停">Ⅱ</button><button class="btn soft iconbtn" id="restart" aria-label="重开" title="重开">↻</button><button class="btn soft iconbtn" id="pick" aria-label="更换 CP 图" title="更换 CP 图">♡</button><input class="upload" id="file" type="file" accept="image/*"></div>
    <div class="toolbar"><button id="sound" type="button">♫ 音效：开</button><button id="help" type="button">怎么玩</button></div>
    <p class="tip">点按游戏框空处直接放下果果，或拖动顶部果果调整落点。<b>两颗同款合成一颗更大的</b>，试试合出西瓜！</p><div class="foot">图片只保存在你的浏览器里 · 点“换 CP 图”可换成自己的图片</div>
  </main>
  <script>
    const portrait=`data:image/svg+xml;charset=utf-8,${encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300"><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#ffe3d5"/><stop offset="1" stop-color="#f4b9c2"/></linearGradient><linearGradient id="shirt"><stop stop-color="#7596a9"/><stop offset="1" stop-color="#f0a4a2"/></linearGradient></defs><rect width="300" height="300" fill="url(#bg)"/><circle cx="150" cy="142" r="122" fill="#fff4e8" opacity=".45"/><path d="M20 306c8-71 40-103 87-103 29 0 44 13 58 32 14-19 31-32 59-32 41 0 66 36 72 103" fill="url(#shirt)"/><path d="M47 143c-7-62 23-99 73-99 39 0 63 25 62 68-21-6-39-23-44-39-19 30-52 46-91 43z" fill="#41373d"/><path d="M167 113c-2-42 18-67 56-67 43 0 66 37 60 92-24-5-45-23-49-46-15 20-36 28-67 21z" fill="#98634f"/><ellipse cx="104" cy="145" rx="45" ry="56" fill="#f5c6ad"/><ellipse cx="211" cy="145" rx="43" ry="55" fill="#efbd9f"/><path d="M78 133q12-10 24 0M111 133q11-9 20 0M193 132q11-9 21 0M222 132q11-8 19 1" fill="none" stroke="#43343a" stroke-width="5" stroke-linecap="round"/><circle cx="100" cy="146" r="4" fill="#45333a"/><circle cx="123" cy="146" r="4" fill="#45333a"/><circle cx="201" cy="145" r="4" fill="#45333a"/><circle cx="224" cy="145" r="4" fill="#45333a"/><path d="M101 174q12 13 25 0M200 173q12 12 24-1" fill="none" stroke="#c66d70" stroke-width="4" stroke-linecap="round"/><ellipse cx="91" cy="160" rx="10" ry="5" fill="#ea9695" opacity=".6"/><ellipse cx="211" cy="160" rx="10" ry="5" fill="#ea9695" opacity=".6"/><path d="M143 230q9-17 18 0" fill="none" stroke="#fff1d9" stroke-width="8" stroke-linecap="round"/><path d="M235 56l5 12 13 2-10 8 2 13-10-7-11 6 4-12-8-9 13 1z" fill="#fff1c1"/><path d="M55 70l4 9 10 1-8 6 2 10-8-5-9 5 3-10-6-7 10 1z" fill="#fff8e6"/></svg>`)}`;
    const sizes=[34,42,50,60,72,84,98,114,132,154];
    const points=[1,3,6,10,15,21,28,36,45,60];
    const board=document.querySelector('#board'),scoreEl=document.querySelector('#score'),nextImg=document.querySelector('#next'),drop=document.querySelector('#drop'),shade=document.querySelector('#shade');
    let fruits=[],score=0,nextLevel=0,aim=.5,active=true,paused=false,celebratedMax=false,dragId=null,pendingDrop=null,hasDropped=false,uid=1,image=portrait,smallestImage='./xiubo-smallest.jpg',secondImage='./xiubo-second-v2.png',thirdImage='./xiubo-third.png',fourthImage='./xiubo-fourth.jpeg',fifthImage='./xiubo-fifth.jpg',sixthImage='./xiubo-sixth-v3.jpg',seventhImage='./xiubo-seventh.jpg',eighthImage='./xiubo-eighth-v2.png',ninthImage='./xiubo-ninth.png',tenthImage='./xiubo-tenth.png',raf=0,soundOn=true,audio=null,best=0;
    try{best=Number(localStorage.getItem('xiubo-merge-best')||0)}catch{}
    const width=()=>board.clientWidth,height=()=>board.clientHeight,clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),radius=l=>sizes[l]/2;
    document.querySelector('#best').textContent=best;
    function beep(freq=520,duration=.075){if(!soundOn)return;try{audio??=new(window.AudioContext||window.webkitAudioContext)();const o=audio.createOscillator(),g=audio.createGain();o.type='sine';o.frequency.value=freq;g.gain.setValueAtTime(.07,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+duration);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+duration)}catch{}}
    const fruitNames=['初遇果','心动果','贴贴果','告白果','热恋果','蜜糖果','同心果','星光果','永恒果','心动西瓜'];
    function fruitImage(level){return level===0?smallestImage:level===1?secondImage:level===2?thirdImage:level===3?fourthImage:level===4?fifthImage:level===5?sixthImage:level===6?seventhImage:level===7?eighthImage:level===8?ninthImage:tenthImage}
    function syncNext(){nextImg.src=fruitImage(nextLevel);nextImg.style.objectPosition=nextLevel===0?'65% 35%':nextLevel===1?'52% 39%':nextLevel===2?'50% 45%':nextLevel===3?'52% 43%':nextLevel===4?'50% 42%':nextLevel===5?'50% 40%':nextLevel===6?'50% 40%':nextLevel===7?'50% 40%':nextLevel===8?'50% 40%':'50% 40%';nextImg.style.width=sizes[nextLevel]+'px';nextImg.style.height=nextImg.style.width;if(hasDropped)document.querySelector('#aimhint').hidden=true;positionPreview()}
    function positionPreview(){drop.style.left=clamp(aim,radius(nextLevel)+5,width()-radius(nextLevel)-5)+'px';drop.style.top=Math.max(2,height()*.2-sizes[nextLevel]-2)+'px';drop.classList.add('on')}
    function add(level,x,y,vx=0,vy=0){const el=document.createElement('div');el.className='fruit';el.dataset.l=level;el.innerHTML='<img alt="心动果果">';el.firstChild.src=fruitImage(level);if(level===0)el.firstChild.style.objectPosition='65% 35%';if(level===1)el.firstChild.style.objectPosition='52% 39%';if(level===2)el.firstChild.style.objectPosition='50% 45%';if(level===3)el.firstChild.style.objectPosition='52% 43%';if(level===4)el.firstChild.style.objectPosition='50% 42%';if(level>=5)el.firstChild.style.objectPosition='50% 40%';el.style.width=sizes[level]+'px';el.style.height=sizes[level]+'px';board.appendChild(el);const f={id:uid++,level,x,y,vx,vy,el,settled:false,stamp:0};fruits.push(f);draw(f);return f}
    function draw(f){f.el.style.left=f.x+'px';f.el.style.top=f.y+'px'}
    function reset(){fruits.forEach(f=>f.el.remove());fruits=[];pendingDrop=null;hasDropped=false;celebratedMax=false;document.querySelector('#aimhint').hidden=false;document.querySelector('#continue').hidden=true;document.querySelector('#winfruit').hidden=true;document.querySelector('#endtext').classList.remove('win-message');score=0;scoreEl.textContent='0';nextLevel=0;aim=width()/2;active=true;paused=false;document.querySelector('#pause').textContent='Ⅱ';shade.classList.remove('show');document.querySelector('#pauseshade').classList.remove('show');document.querySelector('#helpshade').classList.remove('show');syncNext();if(raf)cancelAnimationFrame(raf);raf=requestAnimationFrame(tick)}
    function launch(){if(!active||paused||pendingDrop!==null)return;const level=nextLevel,x=clamp(aim,radius(level)+5,width()-radius(level)-5),y=height()*.2-radius(level)-2;const f=add(level,x,y,0,0);pendingDrop=f.id;hasDropped=true;drop.classList.remove('on');beep(420+level*35);nextLevel=Math.random()<.72?Math.floor(Math.random()*4):Math.floor(Math.random()*6)}
    function tick(){if(!active)return;if(paused){raf=requestAnimationFrame(tick);return}const floor=height()-7;const g=.42;for(const f of fruits){if(f.id===dragId)continue;f.vy=Math.min(f.vy+g,10);f.x=clamp(f.x+f.vx,radius(f.level),width()-radius(f.level));f.y+=f.vy;if(f.y+radius(f.level)>floor){f.y=floor-radius(f.level);f.vy*=-.12;if(Math.abs(f.vy)<.65)f.vy=0;f.vx*=.91}if(f.x===radius(f.level)||f.x===width()-radius(f.level))f.vx*=-.2;draw(f);if(f.id===pendingDrop&&f.y-radius(f.level)>height()*.2){pendingDrop=null;syncNext()}}
      for(let i=0;i<fruits.length;i++)for(let j=i+1;j<fruits.length;j++){const a=fruits[i],b=fruits[j],dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy),min=radius(a.level)+radius(b.level);if(d<min){const nx=d>0?dx/d:1,ny=d>0?dy/d:0,over=min-d;a.x-=nx*over*.51;a.y-=ny*over*.51;b.x+=nx*over*.51;b.y+=ny*over*.51;const closing=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny;if(closing<0){const impulse=-closing*.26;a.vx-=impulse*nx;a.vy-=impulse*ny;b.vx+=impulse*nx;b.vy+=impulse*ny}draw(a);draw(b);if(a.level===b.level&&a.stamp!==b.id&&b.stamp!==a.id&&a.level<sizes.length-1&&performance.now()-Math.max(a.stamp,b.stamp)>100){a.stamp=b.id;b.stamp=a.id;merge(a,b)}}}
      for(const f of fruits)if(f.y-radius(f.level)<height()*.2&&f.vy===0&&f.y>80){finish('堆得太高啦，再来一次！');return}raf=requestAnimationFrame(tick)}
    function merge(a,b){const x=(a.x+b.x)/2,y=(a.y+b.y)/2,l=a.level+1,consumesPending=a.id===pendingDrop||b.id===pendingDrop;fruits=fruits.filter(f=>f!==a&&f!==b);a.el.remove();b.el.remove();const n=add(l,x,y,-1.1,-2.7);n.el.classList.add('pop');n.stamp=performance.now();if(consumesPending){pendingDrop=null;syncNext()}score+=points[l];scoreEl.textContent=score;beep(640+l*60,.12);if(score>best){best=score;document.querySelector('#best').textContent=best;try{localStorage.setItem('xiubo-merge-best',best)}catch{}}if(l===sizes.length-1&&!celebratedMax){celebratedMax=true;showMaxFruit()} }
    function showMaxFruit(){paused=true;document.querySelector('#endtitle').textContent='恭喜你拿到修伯99大结果';document.querySelector('#winfruit').src=tenthImage;document.querySelector('#winfruit').hidden=false;document.querySelector('#endtext').classList.add('win-message');document.querySelector('#endtext').textContent='你可以继续合成果果，直到果堆放不下；也可以重新开始。';document.querySelector('#continue').hidden=false;shade.classList.add('show');beep(880,.35)}
    function finish(message){active=false;paused=false;document.querySelector('#continue').hidden=true;document.querySelector('#winfruit').hidden=true;document.querySelector('#endtext').classList.remove('win-message');document.querySelector('#endtitle').textContent=score?'甜蜜分数 '+score:'再来一局？';document.querySelector('#endtext').textContent=message;shade.classList.add('show');beep(250,.28)}
    function point(e){const r=board.getBoundingClientRect();aim=clamp(e.clientX-r.left,24,width()-24);positionPreview()}
    board.addEventListener('pointermove',e=>{if(dragId){const f=fruits.find(x=>x.id===dragId);if(f){const r=board.getBoundingClientRect();f.x=clamp(e.clientX-r.left,radius(f.level),width()-radius(f.level));f.y=clamp(e.clientY-r.top,radius(f.level),height()-radius(f.level));f.vx=f.vy=0;draw(f)}}else point(e)});
    board.addEventListener('pointerdown',e=>{if(e.target.closest('.fruit')){const el=e.target.closest('.fruit');const f=fruits.find(v=>v.el===el);if(f&&f.y<height()*.27){dragId=f.id;board.setPointerCapture(e.pointerId);e.preventDefault()}else point(e)}else point(e)});
    board.addEventListener('pointerup',e=>{if(dragId){const f=fruits.find(x=>x.id===dragId);if(f)f.vy=1;dragId=null}else if(e.target===board||e.target.closest('.fruit'))launch();drop.classList.remove('on')});
    board.addEventListener('pointercancel',()=>dragId=null);document.querySelector('#restart').onclick=reset;document.querySelector('#again').onclick=reset;document.querySelector('#continue').onclick=()=>{shade.classList.remove('show');document.querySelector('#continue').hidden=true;paused=false};
    document.querySelector('#pause').onclick=()=>{if(!active)return;paused=!paused;document.querySelector('#pause').textContent=paused?'▶':'Ⅱ';document.querySelector('#pauseshade').classList.toggle('show',paused)};document.querySelector('#resume').onclick=()=>{paused=false;document.querySelector('#pause').textContent='Ⅱ';document.querySelector('#pauseshade').classList.remove('show')};
    document.querySelector('#sound').onclick=()=>{soundOn=!soundOn;document.querySelector('#sound').textContent=`♫ 音效：${soundOn?'开':'关'}`;if(soundOn)beep()};document.querySelector('#help').onclick=()=>{paused=active;document.querySelector('#helpshade').classList.add('show')};document.querySelector('#closehelp').onclick=()=>{document.querySelector('#helpshade').classList.remove('show');paused=false};
    document.querySelector('#pick').onclick=()=>document.querySelector('#file').click();document.querySelector('#file').onchange=e=>{const file=e.target.files?.[0];if(!file)return;if(image.startsWith('blob:'))URL.revokeObjectURL(image);image=URL.createObjectURL(file);smallestImage=image;secondImage=image;thirdImage=image;fourthImage=image;fifthImage=image;sixthImage=image;seventhImage=image;eighthImage=image;ninthImage=image;tenthImage=image;fruits.forEach(f=>{f.el.firstChild.src=image;f.el.firstChild.style.objectPosition='center'});syncNext()};
    window.addEventListener('keydown',e=>{if(e.key===' '){e.preventDefault();launch()}else if(e.key==='ArrowLeft'){aim=clamp(aim-24,24,width()-24);positionPreview()}else if(e.key==='ArrowRight'){aim=clamp(aim+24,24,width()-24);positionPreview()}else if(e.key.toLowerCase()==='r')reset();else if(e.key.toLowerCase()==='p')document.querySelector('#pause').click()});
    window.addEventListener('resize',()=>{aim=width()/2;fruits.forEach(f=>{f.x=clamp(f.x,radius(f.level),width()-radius(f.level));draw(f)})});reset();
    if(new URLSearchParams(location.search).get('preview')==='win'){active=false;if(raf)cancelAnimationFrame(raf);add(9,width()/2,height()*.72);showMaxFruit()}
  </script>
</body>
</html>
